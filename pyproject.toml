[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdt"
version = "0.1.0"
description = "Cloud Development Tool — Site Discovery & Exposure Scanner"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Dave", email = "eiz311@gmail.com" }]

dependencies = [
    "typer~=0.12",
    "pydantic~=2.9",
    "httpx~=0.27",
    "dnspython~=2.7",
    "pytricia~=1.0",
    "python-Wappalyzer~=0.3",
    "wafw00f==2.3.1",
    "shodan~=1.31",
    "censys~=2.2",
    "rich~=13.0",
    "structlog~=24.0",
    "PyYAML~=6.0",
    "tenacity~=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "pytest-asyncio~=0.23",
    "pytest-cov~=5.0",
    "respx~=0.21",
    "freezegun~=1.5",
    "ruff~=0.5",
    "mypy~=1.11",
    "types-PyYAML~=6.0",
]

[project.scripts]
cdt = "cdt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pytricia.*", "wafw00f.*", "Wappalyzer.*", "censys.*", "shodan.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["src/cdt"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
